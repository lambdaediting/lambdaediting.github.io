title: Lambda Editing
description: >-
  Professional book editing services from Angela Traficante — copy editing,
  proofreading, technical editing, and beta reading for fiction authors.
email: contact@lambdaediting.com
baseurl: ""
url: "https://lambdaediting.com"

author: Angela Traficante

# Cloudflare Web Analytics site token. Leave empty to disable analytics
# entirely — the beacon script and the analytics paragraph in the privacy
# policy are both gated on this value, so they can never disagree.
cloudflare_analytics_token: "5fb03ec0f9f8445c888179ff84d2137b"

social:
  instagram: https://www.instagram.com/pikapikagoose/
  twitter: https://twitter.com/LambdaEditing
  linkedin: https://www.linkedin.com/in/atraficante/

markdown: kramdown
permalink: pretty

# Blog posts live at /post/<slug>/ to mirror the paths from the old Wix site.
# Scoped to posts only so existing pages keep the site-wide "pretty" style.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /post/:title/

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-last-modified-at

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
