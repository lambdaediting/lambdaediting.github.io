<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141a1d"/>
      <stop offset="1" stop-color="#232e34"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1417" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0f1417" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0f1417" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#ground)"/>

  <!-- Lines of prose, progressively veiled from left to right: the reader's
       view of the scene receding behind each added layer of filter words. -->
  <g fill="#e0e4e6" opacity="0.22">
    <rect x="840" y="88"  width="520" height="13" rx="6.5"/>
    <rect x="840" y="122" width="640" height="13" rx="6.5"/>
    <rect x="840" y="156" width="430" height="13" rx="6.5"/>
    <rect x="840" y="190" width="690" height="13" rx="6.5"/>
    <rect x="840" y="224" width="560" height="13" rx="6.5"/>
    <rect x="840" y="258" width="660" height="13" rx="6.5"/>
    <rect x="840" y="292" width="380" height="13" rx="6.5"/>
    <rect x="840" y="326" width="620" height="13" rx="6.5"/>
    <rect x="840" y="360" width="500" height="13" rx="6.5"/>
    <rect x="840" y="394" width="300" height="13" rx="6.5"/>
  </g>

  <!-- The veils themselves -->
  <g fill="#0e1417">
    <rect x="880"  y="0" width="180" height="500" opacity="0.14"/>
    <rect x="1060" y="0" width="180" height="500" opacity="0.22"/>
    <rect x="1240" y="0" width="180" height="500" opacity="0.30"/>
    <rect x="1420" y="0" width="180" height="500" opacity="0.38"/>
  </g>
  <g stroke="#5c747f" stroke-opacity="0.30" stroke-width="1">
    <line x1="880"  y1="0" x2="880"  y2="500"/>
    <line x1="1060" y1="0" x2="1060" y2="500"/>
    <line x1="1240" y1="0" x2="1240" y2="500"/>
    <line x1="1420" y1="0" x2="1420" y2="500"/>
  </g>

  <rect width="1600" height="500" fill="url(#vignette)"/>
</svg>
