<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141a1d"/>
      <stop offset="1" stop-color="#232e34"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1417" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0f1417" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0f1417" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#ground)"/>

  <!-- A page under the pen: prose with deletions struck, insertions carried
       in above the line. -->
  <g fill="#e0e4e6" opacity="0.26">
    <rect x="860" y="92"  width="560" height="13" rx="6.5"/>
    <rect x="860" y="140" width="300" height="13" rx="6.5"/>
    <rect x="860" y="188" width="640" height="13" rx="6.5"/>
    <rect x="860" y="236" width="420" height="13" rx="6.5"/>
    <rect x="860" y="284" width="600" height="13" rx="6.5"/>
    <rect x="860" y="332" width="360" height="13" rx="6.5"/>
    <rect x="860" y="380" width="520" height="13" rx="6.5"/>
  </g>

  <!-- Struck passages -->
  <g fill="#b5565b" opacity="0.55">
    <rect x="1180" y="140" width="150" height="13" rx="6.5"/>
    <rect x="1300" y="236" width="180" height="13" rx="6.5"/>
    <rect x="1240" y="332" width="130" height="13" rx="6.5"/>
  </g>
  <g stroke="#b5565b" stroke-width="2" opacity="0.95">
    <line x1="1180" y1="146.5" x2="1330" y2="146.5"/>
    <line x1="1300" y1="242.5" x2="1480" y2="242.5"/>
    <line x1="1240" y1="338.5" x2="1370" y2="338.5"/>
  </g>

  <!-- Carets marking insertions -->
  <g stroke="#b5565b" stroke-width="2.5" fill="none" opacity="0.95" stroke-linejoin="round">
    <path d="M1024 111 L1036 96 L1048 111"/>
    <path d="M1148 207 L1160 192 L1172 207"/>
    <path d="M1092 303 L1104 288 L1116 303"/>
  </g>
  <!-- The words carried in above them -->
  <g fill="#b5565b" opacity="0.8">
    <rect x="996"  y="70"  width="80"  height="10" rx="5"/>
    <rect x="1120" y="166" width="96"  height="10" rx="5"/>
    <rect x="1064" y="262" width="72"  height="10" rx="5"/>
  </g>

  <!-- Margin rule -->
  <line x1="820" y1="60" x2="820" y2="440" stroke="#5c747f" stroke-opacity="0.45" stroke-width="2"/>

  <rect width="1600" height="500" fill="url(#vignette)"/>
</svg>
