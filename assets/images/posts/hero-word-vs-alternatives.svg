<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141a1d"/>
      <stop offset="1" stop-color="#232e34"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1417" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0f1417" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0f1417" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#ground)"/>

  <!-- Three stacked manuscript windows: the alternative tools behind,
       the tracked-changes document in front. -->
  <g stroke="#3d4c54" fill="#1b2429">
    <rect x="880"  y="86"  width="400" height="270" rx="8" opacity="0.55"/>
    <rect x="985"  y="128" width="400" height="270" rx="8" opacity="0.75"/>
  </g>
  <g fill="#2a353b" opacity="0.75">
    <path d="M880 94a8 8 0 0 1 8-8h384a8 8 0 0 1 8 8v22H880z"/>
    <path d="M985 136a8 8 0 0 1 8-8h384a8 8 0 0 1 8 8v22H985z"/>
  </g>

  <!-- Front document -->
  <rect x="1090" y="170" width="400" height="270" rx="8" fill="#1e272c" stroke="#5c747f" stroke-width="1.5"/>
  <path d="M1090 178a8 8 0 0 1 8-8h384a8 8 0 0 1 8 8v24h-400z" fill="#314048"/>
  <g fill="#5c747f">
    <circle cx="1108" cy="190" r="4.5"/>
    <circle cx="1124" cy="190" r="4.5"/>
    <circle cx="1140" cy="190" r="4.5"/>
  </g>

  <!-- Tracked changes inside the front document -->
  <g fill="#e0e4e6" opacity="0.30">
    <rect x="1114" y="228" width="300" height="11" rx="5.5"/>
    <rect x="1114" y="256" width="250" height="11" rx="5.5"/>
    <rect x="1114" y="312" width="330" height="11" rx="5.5"/>
    <rect x="1114" y="368" width="210" height="11" rx="5.5"/>
    <rect x="1114" y="396" width="290" height="11" rx="5.5"/>
  </g>
  <g fill="#b5565b" opacity="0.85">
    <rect x="1114" y="284" width="150" height="11" rx="5.5"/>
    <rect x="1114" y="340" width="196" height="11" rx="5.5"/>
  </g>
  <g stroke="#b5565b" stroke-width="1.5" opacity="0.9">
    <line x1="1114" y1="289.5" x2="1264" y2="289.5"/>
    <line x1="1114" y1="345.5" x2="1310" y2="345.5"/>
  </g>

  <rect width="1600" height="500" fill="url(#vignette)"/>
</svg>
