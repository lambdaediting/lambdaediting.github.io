<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141a1d"/>
      <stop offset="1" stop-color="#232e34"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1417" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0f1417" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0f1417" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#ground)"/>

  <!-- A reference card: paired term and ruling, the shape of a style sheet. -->
  <rect x="900" y="64" width="580" height="372" rx="10" fill="#1b2429" stroke="#35434a"/>

  <!-- Card heading -->
  <rect x="936" y="100" width="170" height="14" rx="7" fill="#e0e4e6" opacity="0.55"/>
  <line x1="936" y1="132" x2="1444" y2="132" stroke="#5c747f" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Entries: short term in the accent, its decision ruled out beside it -->
  <g>
    <rect x="936" y="158" width="104" height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1064" y="158" width="240" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>

    <rect x="936" y="196" width="132" height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1092" y="196" width="180" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>

    <rect x="936" y="234" width="88"  height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1048" y="234" width="300" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>

    <rect x="936" y="272" width="150" height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1110" y="272" width="210" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>

    <rect x="936" y="310" width="112" height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1072" y="310" width="264" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>

    <rect x="936" y="348" width="128" height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1088" y="348" width="196" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>

    <rect x="936" y="386" width="96"  height="11" rx="5.5" fill="#5c747f" opacity="0.85"/>
    <rect x="1056" y="386" width="150" height="11" rx="5.5" fill="#e0e4e6" opacity="0.26"/>
  </g>

  <!-- Faint ruling between entries -->
  <g stroke="#35434a" stroke-opacity="0.7">
    <line x1="936" y1="181" x2="1444" y2="181"/>
    <line x1="936" y1="219" x2="1444" y2="219"/>
    <line x1="936" y1="257" x2="1444" y2="257"/>
    <line x1="936" y1="295" x2="1444" y2="295"/>
    <line x1="936" y1="333" x2="1444" y2="333"/>
    <line x1="936" y1="371" x2="1444" y2="371"/>
  </g>

  <rect width="1600" height="500" fill="url(#vignette)"/>
</svg>
