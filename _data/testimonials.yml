- quote: >-
    Angela went above and beyond what I expected. Her approach was perfect
    for my book, and for an author just starting out, I'm particularly
    grateful for the extra insight into self-publishing and the advice she
    offered to help me make the best decisions for my novel.
  author: "Loren Greene"
  attribution: 'author of <a href="https://www.amazon.com/dp/B08YMFXCXX" target="_blank" rel="noopener">the Sakura + Maple series</a>'

- quote: >-
    As an editor, Angela is the rare full package of being kind, skilled,
    reliable, and speedy. I've worked with her on a number of projects for
    Story Garden Publishing, and as a fellow editor, I highly admire her
    commitment to the craft and ability to see the big picture. In fact,
    I've recommended her to so many of my clients that I've lost count. If
    you're looking for an editor who treats you like a human being and not
    just another paycheck, Angela should be your top pick.
  author: "Diane Callahan"
  attribution: 'editor and outliner of <a href="https://www.amazon.com/dp/B08X16SJXP" target="_blank" rel="noopener">the Savannah River series</a>'

- quote: >-
    My line editor educated me more as I applied her suggestions than
    anyone since I began writing to publish. Angela is an absolute gem of
    an editor, and now I can feel her slap my wrist as I type.
  author: "Martin Kearns"
  attribution: 'author of <a href="https://www.amazon.com/dp/B097P94JPQ" target="_blank" rel="noopener">the Valor of Valhalla series</a>'
