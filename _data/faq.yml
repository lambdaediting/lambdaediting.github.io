- category: Scheduling
  items:
    - question: How far out do you book?
      answer: "Although I can sometimes take on new projects immediately or within 1&ndash;2 weeks, it is more likely that I will book you at least 4&ndash;8 weeks out. I can also book you much later if you're the planning-ahead type!"
    - question: What does your schedule look like?
      answer: "I usually only work on one or two projects at a time in order to give them very individualized attention. That means that I tend to turn projects around quickly because they are often the only thing I'm working on."
    - question: What if I need to move my editing or beta reading start date?
      answer: "I can usually be at least somewhat flexible about start dates. If you need an extra few days to finish up your own edits, I can most likely accommodate that. If you want to push it out more than that, I will work with you to schedule a new date that makes sense for us both."

- category: Payment and Billing
  items:
    - question: What payment methods do you accept?
      answer: "My default is to bill with PayPal invoices. PayPal invoices provide safety and security for the transaction and ensure that there is recourse in the event of a disagreement. I can also accommodate other online payment methods such as Stripe, Venmo, and Apple Pay. I do not accept cash or checks."
    - question: What does your billing structure look like?
      answer: "If a project will amount to more than $150 USD, I take a 20% nonrefundable deposit upon booking. The full invoice amount is due before I return files or editorial reports to the client. When I'm almost done with a project, I'll update the invoice, send a reminder for payment, and give you a timeline for receiving your completed project files. I am usually able to produce final files within a day or two after sending the final invoice."
    - question: How do you come up with your quotes?
      answer: |-
        <p>My editing, proofreading, and beta reading rates are listed on their respective pages. All prices will be rounded up based on word count. In the case of flexible rate services like copy editing, I will perform a sample edit or review an author's manuscript to determine the rate, and the quoted rate might be higher than the base rate if I feel that more work will need to be done on the project.</p>
        <p>If you want any changes made to the style of editing or the scheduling of the project (such as expediting the process), I would be happy to discuss that, although it may result in additional cost.</p>

- category: Process
  items:
    - question: What is the difference between copy editing and proofreading?
      answer: "Copy editing is a heavier service that addresses any and all issues with sentence structure, grammar, punctuation, clarity, word choice, and so on. It's ideal for writing that needs some polish in multiple ways before publication. Proofreading is a final pass over the manuscript that fixes small issues like typos, missing words/punctuation, formatting issues, and so on. Proofreading is the final step in the process and is really only meant to be done on already edited text that needs minimal changes."
    - question: What genres do you work on?
      answer: |-
        <p>My preferred editing genres are fantasy, paranormal, romance, mystery, horror, thriller, suspense, speculative fiction, historical fiction, and literary fiction. For romance, I edit all subgenres and heat levels (I love spice!), and I'm extremely comfortable with dark topics in stories (as you can see from <a href="/portfolio/">my portfolio</a>). I mostly edit adult and young adult novels, but I have some experience with middle-grade fiction as well.</p>
    - question: What genres do you not work on?
      answer: "At this time, I do not beta read or edit nonfiction, memoir, short stories, poetry, or children's books. I also do not edit or beta read content that is overly religious or spiritual, as I do not have a lot of experience in that area."
    - question: Do you work on unfinished manuscripts?
      answer: |-
        <p>I generally do not perform copy editing or proofreading services on unfinished manuscripts, as a novel is not typically ready for those steps if it is unfinished.</p>
        <p>If you would like me to look at an unfinished work, feel free to email me. I'm sometimes willing to do beta reads of the beginnings of novels. I am also willing to do copy edits/proofreads on the beginnings of books if you are preparing for something like querying agents. I'd be happy to discuss what you're looking to gain from my services and what my rates are for unfinished work.</p>
      answer_plain: "I generally do not perform copy editing or proofreading services on unfinished manuscripts, as a novel is not typically ready for those steps if it is unfinished. If you would like me to look at an unfinished work, feel free to email me. I'm sometimes willing to do beta reads of the beginnings of novels. I am also willing to do copy edits/proofreads on the beginnings of books if you are preparing for something like querying agents. I'd be happy to discuss what you're looking to gain from my services and what my rates are for unfinished work."
    - question: What are your terms of service?
      answer: 'You can find my <a href="/assets/files/terms-of-service.pdf" target="_blank" rel="noopener">terms of service here</a>. They detail my general process, payment structure, scope of services, confidentiality clause, and communication preferences.'
    - question: How do you handle confidentiality?
      answer: "I will never publicly release your manuscript, in part or as a whole, edited or unedited, without your permission. I will also use reasonable measures of security to ensure that your work is never compromised. You can find my full confidentiality clause in my terms of service."
    - question: Do you edit AI-generated books or content?
      answer: "I do not edit books, stories, or articles solely generated by AI programs. If you've used AI or software like Grammarly to help edit your text, or you've used it to restructure small portions of your text, that's fine, and I will edit that type of work. But if your manuscript is primarily text written by an AI, I'm not a good fit as your editor."
    - question: Do you use AI, automated online/cloud software, LLMs, or similar tools in your editing?
      answer: |-
        <p>Absolutely not. I will never put your work into an LLM, online automated editing tool, AI agent, or anything like that. All my editing is done manually by me, with careful attention to your writing, style, and author voice.</p>
        <p>As part of copy editing and proofreading, I do use Microsoft Word macros and <a href="https://www.perfectit.com/" target="_blank" rel="noopener">PerfectIt</a> to do final checks for typos and word consistency. My Word macros and PerfectIt are both local to my computer, and both macros and PerfectIt are industry-standard tools that have been used by book editors for many years.</p>
      answer_plain: "Absolutely not. I will never put your work into an LLM, online automated editing tool, AI agent, or anything like that. All my editing is done manually by me, with careful attention to your writing, style, and author voice."

- category: About Me
  items:
    - question: What is your education and background?
      answer: |-
        <p>I have a bachelor's degree from Bennington College (Vermont) in English/Literary Arts and Computer Science. I've also taken courses from the <a href="https://www.the-efa.org/" target="_blank" rel="noopener">Editorial Freelancers Association</a> and the <a href="https://www.ciep.uk/" target="_blank" rel="noopener">Chartered Institute of Editing and Proofreading</a> in both proofreading and copy editing. I've been editing, proofreading, and beta reading professionally since 2019 for both indie clients and traditional publishing houses.</p>
    - question: Do you accept work from other editors?
      answer: "I do frequent subcontracting work for other fiction editors. If you would like to subcontract me for a project, definitely get in touch!"
    - question: Do you work for any traditional publishing houses or small presses?
      answer: 'I do freelance copy editing and proofreading for several small presses and traditional publishing houses, including <a href="https://podiumentertainment.com/" target="_blank" rel="noopener">Podium Entertainment</a> and <a href="https://www.sourcebooks.com/" target="_blank" rel="noopener">Sourcebooks</a>. I am always open to working with publishing houses and small presses.'
    - question: Are you open to collaboration on media projects or books about editing?
      answer: "Yes! If you want to interview me for your book, podcast, blog, video, etc., please feel free to get in touch. I've previously collaborated with other writers and editors to provide informative interviews about editing."
